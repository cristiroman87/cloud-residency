services:
  app1:
    image: ${APP_IMAGE}
    command: ["python3", "app.py"]
    environment:
      APP2_URL: http://app2:5001
      APP3_URL: http://app3:5002
    ports:
      - "5000:5000"
    depends_on:
      - app2
      - app3
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-north-1
        awslogs-group: /cloud-residency/app
        awslogs-stream: app1

  app2:
    image: ${APP_IMAGE}
    command: ["python3", "app2.py"]
    volumes:
      - ./logs:/app/logs
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-north-1
        awslogs-group: /cloud-residency/app
        awslogs-stream: app2

  app3:
    image: ${APP_IMAGE}
    command: ["python3", "app3.py"]

  # App3 is intentionally NOT exposed on the EC2 host.
  #
  # App1 reaches App3 through Docker's internal network using:
  #
  # http://app3:5002
  #
  # The browser only communicates with App1 through the ALB.

    environment:
      SECRET_KEY: dev-change-me-now
      DB_HOST: ${DB_HOST}
      DB_PORT: "5432"
      DB_NAME: cloudresidency
      DB_SECRET_ARN: ${DB_SECRET_ARN}

    logging:
      driver: awslogs
      options:
        awslogs-region: eu-north-1
        awslogs-group: /cloud-residency/app
        awslogs-stream: app3