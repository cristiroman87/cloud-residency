name: Application CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compose now expects APP_IMAGE to be supplied externally.
      # For validation we can use a temporary local image name.
      - name: Validate Docker Compose
        env:
          APP_IMAGE: flask-lab:latest
        run: docker compose config

      # CI builds the application image directly.
      - name: Build Docker application
        run: docker build -t flask-lab:latest .

      # Only pushes to main publish an image.
      # Pull requests stop after validation/build.
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::682047236370:role/cloud-residency-github-app
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cloud-residency
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag flask-lab:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Only move the production pointer AFTER the image
      # was successfully pushed to ECR.
      - name: Update production image version
        if: github.event_name == 'push'
        run: |
          aws ssm put-parameter \
            --name "/cloud-residency/app-image-tag" \
            --type "String" \
            --value "${{ github.sha }}" \
            --overwrite \
            --region eu-north-1